# Weekly vulnerability sweep.
#
# CI already runs govulncheck on every push, but that only tells you about an
# advisory the next time someone happens to push. Twice now a Go patch release
# has landed mid-week and reddened the pipeline on an unrelated commit (a docs
# change, once), which reads as "my push broke the build" when it did not.
#
# This job asks the same question on its own schedule, so a new advisory
# surfaces as a scheduled failure naming the toolchain, not as a mystery
# failure on someone's feature branch. It is read-only: it fixes nothing and
# changes nothing. The fix is a one-line bump of the go directive in go.mod,
# because the toolchain CI installs is resolved from go-version-file: go.mod.
name: vulncheck

on:
  schedule:
    # Mondays 08:00 UTC, ahead of the working week.
    - cron: '0 8 * * 1'
  workflow_dispatch: # so it can be run on demand without waiting for Monday

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck (scheduled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          # Deliberately the pinned toolchain, not "latest": the question this
          # job answers is whether the version hebb actually builds with has a
          # known vulnerability, which is exactly what reddens CI.
          go-version-file: go.mod
      - name: go version in use
        run: go version
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.5.0
          govulncheck ./...
